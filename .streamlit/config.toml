# Theme of the test web app (app/streamlit_app.py): dark "mission control" look.
[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0b1020"
secondaryBackgroundColor = "#131b2e"
textColor = "#e2e8f0"
borderColor = "#1f2a44"
baseRadius = "0.75rem"
font = "sans-serif"

[client]
# Hide the "Deploy" button and the developer menu.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[server]
# Same limit as the API (POST /predict/file refuses files over 20 MB).
maxUploadSize = 20
