[project]
name = "gbg-mlops"
version = "0.1.0"
description = "MLOps pipeline for risk detection on IMU bike/scooter rides"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Shared core: needed by every component (pipelines, training, API).
dependencies = [
    "numpy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[dependency-groups]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "mlflow>=3.0,<4",
    "boto3>=1.34,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17",
]
training = [
    "mlflow>=3.0,<4",
    "boto3>=1.34,<2",
    "torch>=2.4,<3",
    "duckdb>=1.1,<2",
    "pyarrow>=17",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "duckdb>=1.1,<2",
]
pipelines = [
    "duckdb>=1.1,<2",
    "prefect>=3.4,<4",
]
app = [
    "httpx>=0.28.1",
    "streamlit>=1.67.0",
]

[tool.uv]
# `uv sync` installs the API + dev tooling; add `--group training` for model work.
default-groups = ["api", "dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbg_mlops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs the API app but no external service",
    "e2e: needs the full docker compose stack running",
]
