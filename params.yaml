# Configuration for training the 1D CNN model (Fiche Ariane)
seed: 42

data:
  train_path: "data/processed/train.npz"
  val_path: "data/processed/val.npz"
  test_path: "data/processed/test.npz"
  normalization_path: "data/processed/normalization.json"

model:
  in_channels: 6
  conv_channels: [32, 64, 128]
  kernel_size: 5
  dropout: 0.2

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  min_delta: 0.001
  pos_weight: null # null means auto-calculated as (n_neg / n_pos)
