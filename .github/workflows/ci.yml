name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group training

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          tags: gbg-api:ci
          push: false

      - name: Build the web app image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          tags: gbg-app:ci
          push: false
